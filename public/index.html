<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CSBK MOBA ARENA 3D</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="joinScreen" class="overlay">
  <div class="panel">
    <div class="logo">CSBK <span>MOBA ARENA</span></div>
    <p class="sub">3D BATTLE • BETA 2026</p>
    <label>Nama pemain / Roblox username</label>
    <input id="playerName" maxlength="20" placeholder="Masukkan username" autocomplete="off">
    <button id="joinBtn">MASUK ARENA</button>
    <small>Prototype beta • Maksimal nyaman dimainkan di browser HP</small>
  </div>
</div>
<div id="hud">
  <div class="topbar">
    <div class="brand">CSBK <b>MOBA ARENA</b></div>
    <div class="score"><span class="blueDot"></span> BLUE <b id="blueCount">0</b> <i>VS</i> <b id="redCount">0</b> RED <span class="redDot"></span></div>
    <div class="beta">BETA</div>
  </div>
  <div class="status"><div><strong id="myName">PLAYER</strong><span id="myHero">KNIGHT</span></div><div class="health"><div id="hpBar"></div></div><small id="hpText">100 / 100 HP</small></div>
  <div class="tips">WASD / joystick untuk bergerak • Serang lawan dalam jarak dekat</div>
</div>
<div id="mobileControls">
  <div id="joystick"><div id="stick"></div></div>
  <div class="skills"><button id="attackBtn">⚔<small>ATTACK</small></button><button id="skillBtn">✦<small>SKILL</small></button></div>
</div>
<div id="notice"></div>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/game.js"></script>
</body>
</html>
