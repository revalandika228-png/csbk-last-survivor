<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CSBK LAST SURVIVOR 2026</title><link rel="stylesheet" href="style.css"></head><body>
